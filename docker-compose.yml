version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: scan2rag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: scan2rag_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-scan2rag_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scan2rag_backend
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SCAN2RAG_API_KEY: ${SCAN2RAG_API_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ALLOW_UNAUTHENTICATED_DEV: ${ALLOW_UNAUTHENTICATED_DEV:-false}
      RATE_LIMIT_QUERY_PER_MIN: ${RATE_LIMIT_QUERY_PER_MIN:-60}
      RATE_LIMIT_RECTIFY_PER_MIN: ${RATE_LIMIT_RECTIFY_PER_MIN:-10}
      RATE_LIMIT_PDF_PER_MIN: ${RATE_LIMIT_PDF_PER_MIN:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - qdrant
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_API_KEY: ${VITE_API_KEY:-}
    container_name: scan2rag_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_storage:
  postgres_data:
